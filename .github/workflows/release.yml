# Release: builds and publishes everything for a version tag. Nothing is built
# or pushed from a workstation.
#
# Cut a release from master (docs/release.md has the details):
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# A tag with a pre-release suffix (v0.2.0-rc.1) makes a pre-release: images get
# only the exact version tag, and the GitHub release is marked pre-release.
#
# Jobs, in order:
#   version   checks the tag is vMAJOR.MINOR.PATCH[-PRERELEASE]
#   ci        the whole CI workflow (ci.yml) on the tagged commit
#   images    multi-arch (linux/amd64, linux/arm64) server and agent images to
#             ghcr.io/byrongary/kubesentry and ghcr.io/byrongary/kubesentry-agent,
#             tagged 0.1.0, 0.1 and latest (not for pre-releases), with SBOM and
#             provenance attestations, signed with cosign (keyless, GitHub OIDC)
#   binaries  kubesentry for macOS, Linux and Windows and kubesentry-agent for
#             Linux (hack/release-binaries.sh), with SHA256SUMS, attached to a
#             draft GitHub release
#   chart     the Helm chart with version and appVersion from the tag, pushed to
#             oci://ghcr.io/byrongary/charts/kubesentry
#   publish   publishes the draft release once everything above succeeded
#
# The first push creates the GHCR packages (kubesentry, kubesentry-agent,
# charts/kubesentry) as private: make each public once under the repository
# owner's Packages, Package settings, Change visibility.
#
# Re-running a failed job is safe: images and the chart are pushed again under
# the same tags, and the binaries replace the draft's assets.
#
# Third-party actions are pinned to a commit SHA, with the release in a comment.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GO_VERSION: "1.27.x"
  HELM_VERSION: v4.3.0
  SERVER_IMAGE: ghcr.io/byrongary/kubesentry
  AGENT_IMAGE: ghcr.io/byrongary/kubesentry-agent
  CHART_REPO: oci://ghcr.io/byrongary/charts

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE"
            exit 1
          fi
          echo "version=${TAG#v}" >>"$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
          fi

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    needs: [version, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing: a Fulcio certificate for this workflow's OIDC identity
    strategy:
      fail-fast: true
      matrix:
        component: [server, agent]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: commit
        name: commit time and image name
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          echo "created=$(git log -1 --format=%cI)" >>"$GITHUB_OUTPUT"
          if [ "$COMPONENT" = agent ]; then
            echo "image=$AGENT_IMAGE" >>"$GITHUB_OUTPUT"
          else
            echo "image=$SERVER_IMAGE" >>"$GITHUB_OUTPUT"
          fi
      # The Dockerfile cross-compiles on the build platform and its final stage
      # only copies, so arm64 builds need no emulation today; QEMU keeps a
      # future RUN in the final stage working.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.commit.outputs.image }}
          # 0.1.0 and 0.1; latest only for a release without a pre-release suffix.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # The Dockerfile labels each image (title, version, revision, created).
          build-args: |
            CMD=${{ matrix.component }}
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.commit.outputs.created }}
          annotations: |
            index:org.opencontainers.image.source=https://github.com/ByronGary/kubesentry
            index:org.opencontainers.image.version=${{ github.ref_name }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.description=kubesentry ${{ matrix.component }}: self-hosted Kubernetes observability dashboard
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign (keyless)
        # The signature covers the digest, so every tag of it is signed.
        env:
          IMAGE: ${{ steps.commit.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  binaries:
    needs: [version, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: build
        run: hack/release-binaries.sh "$GITHUB_REF_NAME" dist
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          cat >notes.md <<EOF
          **Binaries** (attached; checksums in \`SHA256SUMS\`): \`kubesentry\` for macOS (\`darwin_arm64\`, \`darwin_amd64\`), Linux (\`linux_amd64\`, \`linux_arm64\`) and Windows (\`windows_amd64\`), and \`kubesentry-agent\` for Linux. Running from a workstation: [docs/run-remote.md](https://github.com/ByronGary/kubesentry/blob/$TAG/docs/run-remote.md).

          **Images** (linux/amd64, linux/arm64; SBOM, provenance, cosign signature):
          \`$SERVER_IMAGE:$VERSION\`, \`$AGENT_IMAGE:$VERSION\`

          **Helm chart:** \`helm install kubesentry $CHART_REPO/kubesentry --version $VERSION -n kubesentry --create-namespace\`

          Verifying downloads and signatures: [docs/release.md](https://github.com/ByronGary/kubesentry/blob/$TAG/docs/release.md).

          EOF
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run: replace the assets of the existing (draft) release.
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --verify-tag --title "kubesentry $TAG" \
              --notes-file notes.md --generate-notes "${flags[@]}"
          fi

  chart:
    needs: [version, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # push the chart to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: package
        # appVersion is also the default image tag, so the chart deploys the
        # images pushed above.
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: helm package charts/kubesentry --version "$VERSION" --app-version "$VERSION" --destination dist
      - name: push
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/kubesentry-$VERSION.tgz" "$CHART_REPO"
          helm registry logout ghcr.io

  publish:
    needs: [version, images, binaries, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # publish the draft release
    steps:
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
