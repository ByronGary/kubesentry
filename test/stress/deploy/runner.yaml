# Namespace and service account for the in-cluster load generators. They run
# on the load-generator node (kubesentry-worker5) and need to read everything
# (ground truth, pods for targets, secrets for kubesentry's tokens) and to
# create the connectivity mesh, so the account is cluster-admin. Test only.
apiVersion: v1
kind: Namespace
metadata:
  name: stress-load
  labels:
    kubesentry.io/stress: "true"
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stress-runner
  namespace: stress-load
  labels: {kubesentry.io/stress: "true"}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stress-runner
  labels: {kubesentry.io/stress: "true"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin}
subjects:
  - {kind: ServiceAccount, name: stress-runner, namespace: stress-load}
