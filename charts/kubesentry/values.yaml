# Default values for kubesentry.
#
# Every server flag has a value here. Values left at null (or "", or an empty
# list) leave the flag off, so the server's own default applies; the comment
# next to each one names the flag and that default. Profiles:
#   deploy/kind/values-kind.yaml          local kind cluster (dev only)
#   charts/kubesentry/examples/values-eks.yaml   EKS with SSO, AMP, CloudWatch audit and RDS
# docs/deploy-eks.md walks through an EKS install.

# -- Overrides the chart name in resource names.
nameOverride: ""
# -- Overrides the full resource name prefix. With the release name
# "kubesentry", resources are called kubesentry, kubesentry-ingest, and so on.
fullnameOverride: ""
# -- Labels added to every resource.
commonLabels: {}

# -- Shown in the UI header (-cluster-name). Falls back to eks.clusterName.
clusterName: ""

image:
  repository: ghcr.io/byrongary/kubesentry
  # -- Defaults to the chart's appVersion.
  tag: ""
  # -- sha256:... digest; when set it pins the image and the tag is only informative.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -- Server replicas. More than one needs audit.store=postgres when any audit
# source is enabled (the chart refuses otherwise): each replica keeps its own
# informers and snapshot, agents report to every replica (agent.fanout), and
# audit events go through the shared Postgres store.
replicas: 1

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    # Never drop below the desired count; a new pod becomes ready (caches
    # synced, first snapshot built) before an old one stops.
    maxUnavailable: 0
    maxSurge: 1

# -- Server container resources. The server sets GOMEMLIMIT to 90% of
# limits.memory, so the Go GC works to stay under it with headroom for non-heap
# memory. See docs/deploy-eks.md for sizing per cluster size.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}

# -- Pod security context. Compatible with the Pod Security "restricted" level.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Security context of the kubesentry container (merged over these defaults).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# -- Seconds a terminating pod keeps serving before it is signalled, so a load
# balancer (ALB target-type ip) deregisters it first. Uses the native preStop
# sleep action (Kubernetes 1.30+); 0 disables it. Keep it above the target
# group's deregistration delay that applies to in-flight requests.
preStopSleepSeconds: 15
# -- Must exceed preStopSleepSeconds plus the server's shutdown time.
terminationGracePeriodSeconds: 45

# -- Probes, all against the ops listener: readiness on /readyz (503 until the
# informer caches have synced and the first snapshot exists), liveness on /healthz.
probes:
  readiness:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

# -- Extra server flags, appended after the generated ones, e.g. ["-audit-journal=/data/audit.jsonl"].
extraArgs: []
# -- Extra environment variables for the server container.
extraEnv: []
# -- Extra volumes for the server pod.
extraVolumes: []
# -- Extra volume mounts for the server container.
extraVolumeMounts: []
# -- Extra containers in the server pod.
extraContainers: []

serviceAccount:
  # -- Create the server's ServiceAccount.
  create: true
  # -- Name of the ServiceAccount; defaults to the full name.
  name: ""
  # -- Annotations, e.g. for IRSA:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/kubesentry
  # EKS Pod Identity needs no annotation: create a pod identity association for
  # this ServiceAccount instead (docs/deploy-eks.md).
  annotations: {}

rbac:
  # -- Create the read-only ClusterRole and binding for the server. It covers
  # everything kubesentry watches, plus creating SubjectAccessReviews; it never
  # includes Secrets.
  create: true
  # -- ClusterRoles for kubesentry's virtual kubesentry.io resources, to bind to
  # your users and groups. No such API exists; RBAC grants them and kubesentry
  # checks them with SubjectAccessReviews. aggregateTo adds the
  # rbac.authorization.k8s.io/aggregate-to-<role> label for each listed
  # built-in role (view, edit, admin). Aggregating into view also reaches edit
  # and admin, which include view.
  viewerRoles:
    create: true
    # list auditevents.kubesentry.io: audit events, per namespace through a
    # RoleBinding, events without a namespace through a ClusterRoleBinding.
    auditViewer:
      aggregateTo: []
    # get processes.kubesentry.io: the processes inside a namespace's pods.
    processViewer:
      aggregateTo: []
    # list agents.kubesentry.io (cluster-wide): node agent health.
    agentsViewer:
      aggregateTo: []
    # list cloudtrail.kubesentry.io (cluster-wide): the AWS changes attached
    # to incidents (incidents.cloudtrail), in the incident page and bundle.
    cloudtrailViewer:
      aggregateTo: []
    # get pods/log: an incident's container logs, per namespace. kubesentry
    # checks the same permission as kubectl logs, which the built-in view role
    # already grants, so most users need no extra binding.
    logsViewer:
      aggregateTo: []
    # update alerts.kubesentry.io: acknowledge and silence the alerts one can
    # see, per namespace through a RoleBinding; cluster-scoped findings (RBAC
    # drift) need a ClusterRoleBinding. kubesentry records these actions
    # itself and never writes to the cluster or to Alertmanager's silences.
    alertsResponder:
      aggregateTo: []

# -- Server listener and tuning flags beyond the ones grouped elsewhere.
server:
  # -- -pprof: serve /debug/pprof/ on the ops listener.
  pprof: false
  # -- -cache (true): false lists from the API server on every request (debugging only).
  cache: null
  # -- -kube-qps (50) and -kube-burst (100): client-go limits for informers.
  kubeQPS: null
  kubeBurst: null
  # -- -snapshot-min-interval (2s) and -snapshot-max-delay (10s): view rebuild debounce.
  snapshotMinInterval: null
  snapshotMaxDelay: null
  # -- -rate-limit (20/s) and -rate-burst (40) per identity; -max-inflight (512) in total.
  rateLimit: null
  rateBurst: null
  maxInflight: null
  # -- -max-inflight-per-identity (4): requests one user may have in flight on
  # the expensive routes (/oom, pod diagnostics, audit summary); more get 429.
  maxInflightPerIdentity: null
  # -- -allowed-hosts: Host header patterns (host[:port], *.domain) the web
  # listener answers; others get 403. Empty answers any Host. Behind the ALB,
  # e.g. [kubesentry.example.com].
  allowedHosts: []
  # -- -allowed-origins: origins (scheme://host[:port]) besides kubesentry's
  # own and externalURL's from which browsers may send requests that change
  # state (acknowledge, silence); others get 403. Requests without an Origin
  # (curl with the API token) are not affected. e.g. [https://portal.example.com].
  allowedOrigins: []
  # -- -system-principal-prefixes (system:,eks:): users and groups that are
  # components, not people.
  systemPrincipalPrefixes: []
  # -- -builtin-rbac-prefixes (system:,eks:,kubeadm:): platform-created RBAC.
  builtinRBACPrefixes: []
  # -- -node-label-keys-add: node labels to keep beyond the built-in allowlist.
  nodeLabelKeysAdd: []

# -- TLS for the server's listeners (-tls-cert, -tls-key) from a
# kubernetes.io/tls Secret, e.g. one cert-manager issues. Its certificate must
# name <fullname>-ingest.<namespace>.svc, the name agents connect to (fan-out
# included). Agents then use https and verify against agent.tls. With
# oauth2Proxy, the sidecar reaches kubesentry over a Unix socket inside the pod,
# which is plain HTTP. The ops listener stays plain HTTP for kubelet probes and
# Prometheus.
tls:
  enabled: false
  existingSecret: ""

service:
  type: ClusterIP
  # -- Annotations for the web Service (the one the Ingress points at).
  annotations: {}

# -- Bearer tokens. Each is generated once into a Secret and kept across
# upgrades (Helm lookup), unless existingSecret names a Secret you manage, for
# example with External Secrets. GitOps tools that render without cluster access
# (helm template, Argo CD) cannot look secrets up and would generate new tokens
# on every sync: use existingSecret there.
tokens:
  # -- API token (-api-token): the break-glass identity with cluster-wide scope.
  # In token mode, use it through the web port (or kubectl port-forward to the
  # pod's port 8080). With the oauth2Proxy sidecar kubesentry has no TCP web
  # port, so the token works only from inside the pod; for break-glass access
  # while SSO is down, upgrade with oauth2Proxy.enabled=false (token mode) and
  # port-forward. Set enabled: false to remove it.
  api:
    enabled: true
    existingSecret: ""
    key: token
  # -- Agent token (-agent-token): created when agent.enabled. With
  # agent.namespace set, the Secret must exist in both namespaces.
  agent:
    existingSecret: ""
    key: token
  # -- Audit webhook token (-audit-token): created when audit.sources.webhook.enabled.
  audit:
    existingSecret: ""
    key: token

auth:
  # -- -auth-mode: proxy, token or none. Empty picks proxy when oauth2Proxy.enabled,
  # otherwise token. "proxy" without the sidecar trusts identity headers from
  # trustedProxyCIDRs (an SSO proxy you run elsewhere). "none" is refused: it
  # is loopback-only and the chart exposes the web port.
  mode: ""
  # -- -auth-user-header and -auth-groups-header: identity headers set by the
  # proxy. The schema allows only headers oauth2-proxy sets and strips from
  # client requests (X-Forwarded-Email, X-Forwarded-User,
  # X-Forwarded-Preferred-Username; X-Forwarded-Groups), since any other header
  # could arrive from the client unchanged. Groups are comma-separated, so group
  # names containing commas are not supported.
  userHeader: X-Forwarded-Email
  groupsHeader: X-Forwarded-Groups
  # -- Allow other userHeader/groupsHeader values, for an SSO proxy of your own
  # that sets them and strips client-supplied copies.
  allowCustomHeaders: false
  # -- -auth-username-prefix and -auth-groups-prefix: match the prefixes your
  # API server (or EKS OIDC identity provider) applies, so RoleBindings written
  # for kubectl users also apply in kubesentry, e.g. "oidc:".
  usernamePrefix: ""
  groupsPrefix: ""
  # -- IdP group to Kubernetes groups, written to a ConfigMap and passed as
  # -auth-group-map-file. Useful when the IdP sends group IDs (Entra ID object
  # IDs) or names that differ from your RBAC subjects, e.g.
  #   "4f6b0b8e-...": ["platform-admins"]
  #   "team-payments": ["payments-viewers", "payments-oncall"]
  groupMap: {}
  # -- -auth-trusted-proxy-cidrs: with auth.mode=proxy and no sidecar, only
  # these addresses may send identity headers. Unused with oauth2Proxy.enabled:
  # the sidecar talks to kubesentry over a Unix socket, the only path trusted.
  trustedProxyCIDRs: []
  # -- -auth-allow-any-proxy: permit 0.0.0.0/0 or ::/0 in trustedProxyCIDRs,
  # only when a network policy admits nothing but the proxy to the web port.
  allowAnyProxy: false
  # -- -authz-qps: SubjectAccessReview budget.
  authzQPS: 200
  # -- -authz-cache-ttl and -authz-deny-ttl: how long allowed and denied reviews are cached.
  authzCacheTTL: 5m
  authzDenyTTL: 1m
  # -- -authz-share-by-groups: cache reviews per RBAC-relevant group set rather
  # than per user. Fewer reviews when thousands of users share a few groups;
  # only correct when no RoleBinding names individual users.
  shareByGroups: false

# -- oauth2-proxy sidecar for SSO. When enabled, the sidecar owns the web port
# (4180) and kubesentry, in proxy mode, listens only on a Unix socket in an
# emptyDir the two containers share (/var/run/kubesentry/web.sock, mode 0660):
# identity headers are trusted on that socket and nowhere else, so kubectl
# port-forward cannot reach kubesentry around the proxy. The sidecar strips any
# client-supplied X-Forwarded-* identity headers before they reach kubesentry.
# oauth2-proxy supports Unix socket upstreams since v7.6.0.
oauth2Proxy:
  enabled: false
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.15.5
    pullPolicy: IfNotPresent
  # -- oauth2-proxy provider: oidc (Okta, Cognito, Keycloak, Google Workspace...),
  # or entra-id for Microsoft Entra ID (handles group overage through Graph).
  provider: oidc
  # -- OIDC issuer, e.g. https://example.okta.com/oauth2/default,
  # https://login.microsoftonline.com/<tenant-id>/v2.0,
  # https://cognito-idp.<region>.amazonaws.com/<user-pool-id>.
  issuerURL: ""
  clientID: ""
  # -- Secret with the client secret and the cookie secret (16, 24 or 32 bytes,
  # e.g. `openssl rand -base64 32 | tr -- '+/' '-_'`). Required.
  existingSecret: ""
  clientSecretKey: client-secret
  cookieSecretKey: cookie-secret
  # -- https://<host>/oauth2/callback. Defaults to the ingress host.
  redirectURL: ""
  # -- OAuth scopes. Entra ID with group overage needs "openid email profile User.Read".
  scope: openid email profile
  # -- Claim holding the user's groups (Cognito: cognito:groups).
  groupsClaim: groups
  emailClaim: email
  # -- PKCE method; Okta, Entra ID and Cognito support S256. Empty disables PKCE.
  codeChallengeMethod: S256
  # -- --email-domain: allowed email domains ("*" for any; restrict with allowedGroups).
  emailDomains: ["*"]
  # -- --allowed-group: only members of these IdP groups may sign in.
  allowedGroups: []
  # -- --upstream-timeout: how long oauth2-proxy waits for kubesentry before
  # answering 502 (oauth2-proxy's own default is 30s). kubesentry gives API
  # routes 30s and the pod page and /oom 60s, then answers 503 itself; 65s
  # lets that answer through. An ALB in front needs a longer idle timeout
  # (ALB default 60s): idle_timeout.timeout_seconds=75 (docs/deploy-eks.md).
  upstreamTimeout: 65s
  # -- --trusted-proxy-ip: IPs or CIDRs of the reverse proxy in front (the ALB's
  # subnets, or the VPC CIDR) allowed to set X-Forwarded-For/Host/Proto. Headers
  # from other peers are ignored. Empty: oauth2-proxy trusts them from every
  # peer (0.0.0.0/0, ::/0). Identity headers do not depend on this: the sidecar
  # always strips them and sets its own.
  trustedProxyIPs: []
  cookie:
    name: _kubesentry
    # -- Requires HTTPS in front (the ALB terminates TLS).
    secure: true
    expire: 12h
    # -- Re-validate the session (and re-read groups) this often; needs refresh
    # tokens from the IdP (Okta: offline_access scope). Empty disables.
    refresh: ""
    sameSite: lax
  # -- Session storage. cookie keeps the session in the browser; users in many
  # groups (Entra ID, large Okta orgs) can exceed header limits on the ALB.
  # redis keeps only a ticket in the cookie (ElastiCache works; use rediss:// for TLS).
  sessionStore:
    type: cookie
    redis:
      connectionURL: ""
      useCluster: false
      clusterConnectionURLs: []
      # -- Secret holding the Redis password (or AUTH token), optional.
      existingSecret: ""
      passwordKey: redis-password
  extraArgs: []
  extraEnv: []
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

prometheus:
  # -- -prometheus-url. Empty: discover an in-cluster Prometheus (autodiscover),
  # or use prometheus.amp.
  url: ""
  # -- -prometheus-autodiscover (true): find a Prometheus Service in the cluster
  # when url is empty; a Service annotated kubesentry.io/prometheus=true wins.
  autodiscover: true
  # -- -prometheus-service: pin discovery to namespace/name:port,
  # e.g. monitoring/kps-kube-prometheus-stack-prometheus:9090.
  service: ""
  # -- -prometheus-selector: extra label matchers added to every query, for a
  # Prometheus shared by several clusters, e.g. cluster="prod".
  selector: ""
  # -- -prometheus-ksm-limits: read memory limits from kube-state-metrics
  # instead of pod specs.
  ksmLimits: false
  # -- Bearer token for Prometheus (PROMETHEUS_TOKEN) from an existing Secret.
  bearerTokenSecret:
    name: ""
    key: token
  # -- -leak-scan-interval (5m) and -leak-scan-window (24h): the background leak scanner.
  leakScan:
    interval: null
    window: null
  # -- Amazon Managed Service for Prometheus. Queries are SigV4-signed with the
  # pod's AWS identity (IRSA or Pod Identity); see docs/deploy-eks.md for IAM.
  amp:
    enabled: false
    # -- The workspace endpoint without /api/v1, e.g.
    # https://aps-workspaces.us-east-1.amazonaws.com/workspaces/ws-12345678-abcd-...
    workspaceURL: ""
    # -- -aws-region; defaults to eks.region, then the region in workspaceURL.
    region: ""

audit:
  # -- -audit-store: memory (default; per replica, lost on restart) or postgres.
  store: memory
  # -- -audit-retention for the Postgres store: daily partitions older than
  # this are dropped. Accepts h and d units, e.g. 720h or 30d.
  retention: 30d
  # -- -audit-redact-exec-args: drop exec command arguments from stored request URIs.
  redactExecArgs: false
  # -- -audit-max-events (50000): events kept by the memory store.
  maxEvents: null
  postgres:
    # -- Secret with a Postgres DSN, passed as KUBESENTRY_PG_DSN, e.g.
    # postgres://kubesentry:PASSWORD@db.xxxx.us-east-1.rds.amazonaws.com:5432/kubesentry
    existingSecret: ""
    dsnKey: dsn
    # -- -pg-schema: one schema per cluster when clusters share a database.
    schema: kubesentry
    # -- -pg-max-conns (10 when empty): pooled connections per replica; audit
    # reads share all but two (writes, maintenance). The replica holding a
    # lock (CloudWatch reader, alerts, incidents) keeps one more connection per
    # lock. Size max_connections (RDS: by instance class) for replicas times
    # this, plus three.
    maxConns: null
    # -- -pg-query-timeout (10s when empty): an audit read running longer is
    # cancelled in Postgres and answered 503 + Retry-After.
    queryTimeout: ""
    # -- Sets PGSSLMODE (an sslmode in the DSN wins). verify-full checks the
    # server certificate and host name: with RDS, provide the RDS CA bundle in
    # sslRootCert. Use disable only for a Postgres without TLS inside the cluster.
    sslmode: verify-full
    # -- CA bundle for verify-full (PGSSLROOTCERT), from a ConfigMap or a Secret,
    # e.g. the RDS global bundle https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
    sslRootCert:
      configMap: ""
      secret: ""
      key: global-bundle.pem
  sources:
    # -- POST /audit/webhook on the ingest listener, authenticated with the
    # audit token. For self-managed API servers (--audit-webhook-config-file)
    # and bulk imports.
    webhook:
      enabled: false
    # -- Native EKS reader: polls the cluster's CloudWatch Logs audit stream.
    # Needs EKS control-plane audit logging and logs:FilterLogEvents (docs/deploy-eks.md).
    # With several replicas, only the holder of a Postgres advisory lock reads.
    cloudwatch:
      enabled: false
      # -- -cloudwatch-log-group; defaults to /aws/eks/<eks.clusterName>/cluster.
      logGroup: ""
      # -- -cloudwatch-stream-prefix (kube-apiserver-audit).
      streamPrefix: ""
      # -- -cloudwatch-start (24h): how far back to read on first start.
      start: ""
      # -- -cloudwatch-endpoint: override the endpoint (VPC endpoint or tests).
      endpoint: ""
    # -- Follow an API server audit log file (-audit-log-file). Only for clusters
    # where kubesentry can run on a control-plane node (kind, kubeadm).
    file:
      path: ""
      # -- -audit-from-start: read existing content instead of starting at the end.
      fromStart: false
      # -- Mount this host directory read-only at the same path (hostPath). It
      # usually needs root and a privileged Pod Security level; dev only.
      hostPathDir: ""

eks:
  # -- EKS cluster name: -cluster-name (unless clusterName is set) and the
  # default CloudWatch log group /aws/eks/<name>/cluster.
  clusterName: ""
  # -- AWS region (-aws-region and AWS_REGION) for CloudWatch and AMP.
  region: ""
  awsAuth:
    # -- -aws-auth: read kube-system/aws-auth to flag system:masters mappings.
    # Adds a Role in kube-system limited to that one ConfigMap.
    read: false

systemNamespaces:
  # -- -system-namespaces: replaces the built-in list (kube-*, local-path-storage,
  # amazon-cloudwatch, amazon-guardduty, aws-observability, karpenter).
  # kubesentry's own namespaces are always added. A namespace label
  # kubesentry.io/system="true"|"false" overrides either list.
  replace: []
  # -- -system-namespaces-add: extends the list.
  add: []

# -- Thresholds between ok, warn and crit. null keeps the server default (in brackets).
# Durations use Go syntax (90s, 5m, 24h, 168h).
thresholds:
  restartWarn: null       # -restart-warn (3) restarts summed over a pod's containers
  restartCrit: null       # -restart-crit (10)
  oomRecent: null         # -oom-recent (24h) an OOM kill within this is crit
  pendingGrace: null      # -pending-grace (5m)
  notReadyGrace: null     # -not-ready-grace (5m)
  terminatingGrace: null  # -terminating-grace (5m) beyond the pod's grace period
  recentPod: null         # -recent-pod (24h) finished pods newer than this stay on the map
  activityWindow: null    # -activity-window (168h) audit look-back on the pod page
  pvcMinAge: null         # -pvc-min-age (24h) ignore unused claims younger than this
  leakCritHours: null     # -leak-crit-hours (6) hours to the memory limit that make a leak crit
  leakMinSlope: null      # -leak-min-slope (1 MiB/h) minimum growth, as the server parses it
  leakMinR2: null         # -leak-min-r2 (0.8)
  leakDropRatio: null     # -leak-drop-ratio (0.7) a drop below this ratio is a restart
  leakMinPoints: null     # -leak-min-points (6)
  certCritCap: null       # -cert-crit-cap (168h)
  certWarnCap: null       # -cert-warn-cap (720h)

# -- Storage cost estimates for unused volumes, in USD per GiB-month. A
# StorageClass annotation kubesentry.io/price-per-gib-month wins over all of these.
pricing:
  # -- -pvc-default-price: price for classes nothing else prices. null: no estimate.
  defaultPrice: null
  # -- -ebs-prices by EBS volume type, e.g. {gp3: 0.0912, io2: 0.143} outside us-east-1.
  ebsPrices: {}
  # -- -pvc-class-prices by StorageClass name.
  classPrices: {}

# -- Who owns a namespace and which namespaces are production. The Overview
# filters and attributes by owner and counts exec into production; alerting
# routes by the same annotation and label.
alerts:
  # -- -alerts: evaluate findings and send them to Alertmanager (docs/alerts.md).
  # Notify only: kubesentry never writes to the cluster. With replicas > 1 it
  # needs audit.store=postgres: the replica holding the alerts lock notifies.
  enabled: false
  # -- -owner-annotation: the namespace annotation naming the owning team (the
  # alerts' owner label). Every other kubesentry.io/<x> namespace annotation
  # becomes the label kubesentry_<x>, a routing hint (e.g. kubesentry.io/slack-channel).
  ownerAnnotation: kubesentry.io/owner
  production:
    # -- -production-label: namespaces labelled labelKey=labelValue are
    # production (the alerts' production label).
    labelKey: environment
    labelValue: production
  # -- Owner of findings whose namespace has no owner annotation, and of
  # cluster-scoped findings (-alerts-default-owner). Incidents use it too.
  defaultOwner: platform
  # -- Alerts are evaluated after view rebuilds, at most this often, and at
  # least this often in a quiet cluster (-alerts-interval).
  interval: 30s
  # -- Open alerts are posted again this often, with endsAt 4x this ahead (-alerts-resend).
  resend: 1m
  # -- A finding gone this long resolves (-alerts-resolve-grace).
  resolveGrace: 5m
  # -- More new alerts than this in one evaluation go out as one digest per
  # owner, labelled kubesentry_digest="true" (-alerts-max-new).
  maxNew: 50
  # -- One owner gets at most ownerMaxNew new alerts on their own in any
  # ownerWindow; more join that owner's digest (-alerts-owner-max-new,
  # -alerts-owner-window).
  ownerMaxNew: 20
  ownerWindow: 15m
  # -- The longest silence a user may set on a finding, at most 30d
  # (-alerts-max-silence). Silences and acknowledgements need update on
  # alerts.kubesentry.io (rbac.viewerRoles.alertsResponder).
  maxSilence: 7d
  # -- A memory leak alert is critical when the limit is closer than this many
  # hours; null uses thresholds.leakCritHours (-alerts-leak-crit-hours).
  leakCritHours: null
  # -- Each alert's runbook_url is this plus "#<alert name in lower case>";
  # empty: docs/alerts.md on GitHub. Point it at your own copy if you keep runbooks internally.
  runbookBaseURL: ""
  # -- Checks that never alert (-alerts-disable-checks), e.g. [nodeport,
  # ingress-no-tls]; their open findings resolve. The checks are listed in
  # docs/alerts.md, section 3.
  disableChecks: []
  # -- KubesentryAuditActivity: exec, secret reads, RBAC changes,
  # impersonation, bursts of denied requests and anonymous access, read from
  # the audit store (audit.sources). null keeps the server default (in brackets).
  audit:
    # -- -alerts-audit: the audit checks to run (all six); [] runs none.
    checks: null
    # -- -alerts-audit-production-only (audit-exec, audit-secret-read): checks
    # that count only events in production namespaces; [] for none.
    productionOnly: null
    hold: null          # -alerts-audit-hold (1h) a finding stays open this long after its newest event
    deniedBurst: null   # -alerts-audit-denied-burst (20) denied requests by one actor...
    deniedWindow: null  # -alerts-audit-denied-window (10m) ...within this window
  # -- Standing-state digests (KubesentryStandingDigest, severity info,
  # kubesentry_digest="true"): one alert per owner and kind at a fixed time,
  # for what stands rather than what changed. Route them to a quiet receiver
  # (docs/monitoring-eks.md).
  digests:
    # -- -alerts-digest-at: "Mon 09:00" weekly, "09:00" daily; empty: off.
    at: ""
    # -- -alerts-digest-tz: the time zone of at (an IANA name).
    tz: UTC
    # -- -alerts-digest-kinds: rbac-posture, unused-volumes, certificates;
    # null sends all three.
    kinds: null
    # -- -alerts-cert-digest-days (14): with the certificates digest, an
    # expiring certificate with more days left is only listed there.
    certDays: null
  # -- -alerts-agents: KubesentryAgentMissing, for nodes running the chart's
  # agent whose reports stopped. auto: on with replicas 1 or agent.fanout
  # (every replica hears every agent); "on"; "off" (quote them: YAML reads
  # bare on and off as booleans).
  agents: auto
  alertmanager:
    # -- Alertmanager base URLs (-alertmanager-url); every alert goes to each
    # (list both members of an HA pair). Amazon Managed Prometheus:
    # https://aps-workspaces.<region>.amazonaws.com/workspaces/<id>/alertmanager,
    # signed with SigV4 by the pod's IAM role (aps:CreateAlertManagerAlerts).
    # Empty: findings are tracked and listed, nobody is notified.
    urls: []
    # -- Secret holding the bearer token (tokenKey) or, with basicAuth.username,
    # the basic auth password (passwordKey). Not with SigV4.
    existingSecret: ""
    tokenKey: token
    basicAuth:
      username: ""
      passwordKey: password
    # -- Sign requests with SigV4; automatic when every URL is an AMP workspace.
    sigv4: false
    # -- CA bundle that signs Alertmanager's certificate (added to the system
    # roots), from a ConfigMap or a Secret.
    ca:
      configMap: ""
      secret: ""
      key: ca.crt

# -- kubesentry's URL as users reach it, e.g. https://kubesentry.example.com
# (-external-url): each alert links to its finding there (kubesentry_url),
# and, with incidents on, to the incident it joined (incident_url).
externalURL: ""

# -- Incidents (-incidents, docs/incidents.md): the critical and warning
# signals of one workload (request, error and memory spikes, restarts, OOM
# kills, Kubernetes events, alert episodes) grouped into one incident, with the
# deploys, audit edits, AWS changes and logs around it on one time axis.
# Dashboard only: incidents never notify. null keeps the server default (in
# brackets). Durations take Go syntax, and d for days where noted.
incidents:
  # -- Needs server.cache (the default). With replicas > 1 it needs
  # audit.store=postgres: one replica, holding the incidents lock, runs the
  # engine and the others read the store (the chart refuses otherwise).
  enabled: false
  interval: null         # -incident-interval (1m) how often request and memory metrics are scanned
  maxRange: null         # -incident-max-range (24h) an incident longer than this closes (capped) and continues in a new one; at most 24h
  retention: null        # -incident-retention (7d) resolved incidents kept; at least 24h; h or d units
  eventsRetention: null  # -incident-events-retention (48h) Kubernetes events kept; h or d units
  quiet: null            # -incident-quiet (15m) resolves once no trigger has been active this long
  lookbehind: null       # -incident-lookbehind (30m) deploys and changes this long before the start attach
  logLead: null          # -incident-log-lead (5m) logs and events are read from this long before the start
  logLag: null           # -incident-log-lag (10m) ...and until this long after the end (logs are written late)
  # -- -incident-namespaces: only these namespaces have incidents. Empty: all
  # but the system namespaces.
  namespaces: []
  # -- -incident-include-system: system namespaces have incidents too.
  includeSystem: false
  # -- -incident-app-label: a custom label key that ties workloads into one app
  # (tags incidents and relates them), e.g. example.com/system.
  appLabel: ""
  # -- -incident-app-labels: replaces the label keys incidents are tagged with
  # (app.kubernetes.io/{name,instance,part-of,component}, app, k8s-app); a
  # trailing * matches a prefix. Empty keeps the defaults.
  appLabels: []
  # -- What opens an incident and how severe it is.
  thresholds:
    requestRatio: null      # -incident-request-ratio (2) request rate against its baseline: warning
    requestCritRatio: null  # -incident-request-crit-ratio (4) critical
    requestMinRPS: null     # -incident-request-min-rps (1) subjects below this never spike
    errorRatio: null        # -incident-error-ratio (0.05) share of 5xx responses: warning
    errorCritRatio: null    # -incident-error-crit-ratio (0.2) critical
    memoryLimitPct: null    # -incident-memory-limit-pct (85) percent of the memory limit: warning
    memoryCritPct: null     # -incident-memory-crit-pct (95) critical
    memoryJumpRatio: null   # -incident-memory-jump-ratio (1.5) without a limit, a jump against the previous scan...
    memoryJumpMin: null     # -incident-memory-jump-min (128MiB) ...of at least this much
    spikeRecent: null       # -incident-spike-recent (5m) the recent window a request rate is averaged over
    spikeBaseline: null     # -incident-spike-baseline (1h) the baseline window before it
    eventMinCount: null     # -incident-event-min-count (3) BackOff, Unhealthy and the like in 5 minutes
  # -- -incident-request-sources: built-in Prometheus request profiles to read
  # (nginx: ingress-nginx per Service; app: http_requests_total per pod).
  # null keeps both; [] reads none.
  requestSources: null
  # -- Request profiles of your own, written to a ConfigMap and read with
  # -incident-request-profiles-file, besides the built-ins named above (one
  # with a built-in's name replaces it). Each is {name, metric,
  # namespaceLabel, namespaceFallbackLabel, serviceLabel or podLabel,
  # statusLabel, errorRegex}; kubesentry builds the PromQL itself, e.g.
  #   - name: envoy
  #     metric: envoy_cluster_upstream_rq_total
  #     namespaceLabel: namespace
  #     serviceLabel: service
  #     statusLabel: response_code
  requestProfiles: []
  # -- -incident-alb: read ALB request counts and 5xx from CloudWatch for the
  # target groups of TargetGroupBindings (AWS Load Balancer Controller).
  # IAM: cloudwatch:GetMetricData and cloudwatch:ListMetrics.
  alb: false
  # -- -incident-event-normal-reasons: Normal Kubernetes event reasons kept
  # besides every Warning. null keeps the default (SuccessfulRescale); []
  # keeps Warnings only.
  eventNormalReasons: null
  # -- Container logs of an incident, read when someone views them (never stored).
  logs:
    # -- -incident-logs (auto): auto (CloudWatch first when group is set, then
    # pods/log), kubernetes, cloudwatch or off. With kubernetes or auto the
    # chart grants kubesentry get on pods/log.
    mode: ""
    # -- -incident-logs-group: the CloudWatch Logs group of container logs.
    # With mode cloudwatch it defaults to Container Insights'
    # /aws/containerinsights/<clusterName>/application. IAM: logs:FilterLogEvents.
    group: ""
    # -- -incident-logs-stream-prefix: a stream name prefix template with
    # {namespace} and {pod}, when streams are named by pod. Empty: a filter
    # pattern on the kubernetes.namespace_name and pod_name fields.
    streamPrefix: ""
    maxLines: null   # -incident-logs-max-lines (2000) lines one read returns at most
    maxBytes: null   # -incident-logs-max-bytes (1MiB) bytes one read returns at most
  # -- -incident-redact-patterns: regular expressions (RE2) whose matches are
  # redacted from logs, event messages, CloudTrail records and bundles,
  # besides the built-in secret shapes.
  redactPatterns: []
  # -- AWS changes attached to incidents as context (needs enabled).
  cloudtrail:
    # -- -cloudtrail: "off", lookup (the CloudTrail event history, through
    # LookupEvents) or logs (a trail delivered to CloudWatch Logs). Quote
    # "off": unquoted, YAML reads it as false.
    mode: "off"
    # -- -cloudtrail-log-group: with mode logs, the trail's log group.
    logGroup: ""
    # -- -cloudtrail-region: the region whose CloudTrail is read; defaults to
    # eks.region.
    region: ""
    qps: null    # -cloudtrail-qps (1) LookupEvents calls per second; the account and region allow about 2, shared
    start: null  # -cloudtrail-start (1h) how far back the first read goes; at most 24h

# -- Node agent DaemonSet: reports the processes inside pods. Needs hostPID,
# which the Pod Security baseline and restricted levels reject.
agent:
  enabled: true
  # -- Namespace for the agent; empty uses the release namespace. A separate
  # namespace labelled pod-security.kubernetes.io/enforce=privileged lets the
  # server's namespace enforce restricted.
  namespace: ""
  # -- Create agent.namespace with namespaceLabels (Helm then owns it, and
  # deletes it on uninstall).
  createNamespace: false
  namespaceLabels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
  image:
    repository: ghcr.io/byrongary/kubesentry-agent
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # -- -interval between reports.
  interval: 15s
  # -- -jitter (0.2): ±fraction of the interval, so agents do not report in lockstep.
  jitter: null
  # -- -gzip (true): compress reports.
  gzip: null
  # -- -max-processes (5000) per node.
  maxProcesses: null
  # -- -server-fanout: post every report to each server replica through the
  # headless ingest Service, so every replica has every node's processes.
  fanout: true
  # -- CA for verifying the server (-ca-file) when tls.enabled. Defaults to the
  # ca.crt in tls.existingSecret when the agent shares the release namespace.
  tls:
    caSecret: ""
    caConfigMap: ""
    caKey: ca.crt
  serviceAccount:
    create: true
    name: ""
  priorityClassName: system-node-critical
  # -- Run on every node, tainted ones included.
  tolerations:
    - operator: Exists
  nodeSelector: {}
  # -- The agent always requires kubernetes.io/os=linux and skips Fargate
  # (eks.amazonaws.com/compute-type=fargate). excludeLabels adds more NotIn
  # terms, e.g. KWOK fake nodes: [{key: type, values: [kwok]}].
  nodeAffinity:
    excludeLabels: []
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi
  podAnnotations: {}
  podLabels: {}
  # -- Non-root and read-only; hostPID is the only host access. On SELinux-enforcing
  # nodes (Bottlerocket) see docs/deploy-eks.md.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  extraArgs: []
  extraEnv: []

# -- PodDisruptionBudget for the server, created when replicas > 1.
pdb:
  enabled: true
  minAvailable: 1

# -- NetworkPolicy for the server pods. Needs a CNI that enforces it (on EKS,
# the VPC CNI with enableNetworkPolicy=true). Each allowed peer list is empty
# by default: turning the policy on without filling them closes that port.
networkPolicy:
  enabled: false
  ingress:
    # -- Web port (4180 with oauth2Proxy, else 8080), e.g. the ALB subnets'
    # CIDRs for target-type ip, or an ingress controller's namespace.
    web:
      fromCIDRs: []
      # -- Namespace names, matched on kubernetes.io/metadata.name.
      fromNamespaces: []
    # -- Ingest port 8081. The chart's agent pods are always allowed; add API
    # servers sending audit webhooks or bulk importers here.
    ingest:
      fromCIDRs: []
      fromNamespaces: []
    # -- Ops port 9090 (/metrics), e.g. your Prometheus namespace. Kubelet
    # probes come from the node; most CNIs (the VPC CNI included) allow those
    # regardless. If yours does not, add the node CIDRs here.
    ops:
      fromNamespaces: []
      fromCIDRs: []
  egress:
    # -- Also restrict egress. Off: egress stays open.
    enabled: false
    # -- DNS to kube-dns / CoreDNS in kube-system.
    dns: true
    # -- 443 (and 6443) for the Kubernetes API server and AWS APIs (STS,
    # CloudWatch Logs, AMP) and the IdP. 0.0.0.0/0 unless you route AWS APIs
    # through VPC endpoints and know the API server's addresses.
    https:
      toCIDRs: ["0.0.0.0/0"]
      ports: [443, 6443]
    # -- EKS Pod Identity: the node-local agent that hands out credentials
    # (169.254.170.23:80, and fd00:ec2::23 on IPv6 clusters). IRSA needs only https.
    podIdentityAgent: false
    postgres:
      toCIDRs: []
      port: 5432
    redis:
      toCIDRs: []
      port: 6379
    prometheus:
      toCIDRs: []
      toNamespaces: []
      ports: [9090]
    # -- An in-cluster Alertmanager (alerts.alertmanager.urls); AMP's goes over https.
    alertmanager:
      toCIDRs: []
      toNamespaces: []
      ports: [9093]
    # -- Raw egress rules appended to the policy.
    extra: []

# -- Spread server replicas across zones and nodes. labelSelector and
# matchLabelKeys (pod-template-hash) are filled in.
topologySpread:
  enabled: true
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway
  topologyKeys:
    - topology.kubernetes.io/zone
    - kubernetes.io/hostname

# -- Ingress for the web Service. AWS Load Balancer Controller example:
#   className: alb
#   annotations:
#     alb.ingress.kubernetes.io/scheme: internal          # or internet-facing
#     alb.ingress.kubernetes.io/target-type: ip
#     alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
#     alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:111122223333:certificate/...
#     alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
#     alb.ingress.kubernetes.io/healthcheck-path: /ping    # oauth2-proxy; use /healthz without it
#     alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=10
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  path: /
  pathType: Prefix
  # -- TLS at the Ingress itself (not needed with an ALB certificate-arn).
  tls: []

metrics:
  # -- prometheus-operator ServiceMonitor for the ops listener's /metrics.
  # Rendered only when the monitoring.coreos.com/v1 API is available.
  serviceMonitor:
    enabled: false
    # -- Labels your Prometheus selects ServiceMonitors by, e.g. release: kps.
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
    relabelings: []
    metricRelabelings: []
  # -- PrometheusRule with kubesentry's alerts. Rendered only when the
  # monitoring.coreos.com/v1 API is available. docs/monitoring-eks.md has a
  # runbook for each alert.
  prometheusRule:
    enabled: false
    labels: {}
    # -- Label matchers selecting kubesentry's series; defaults to namespace="<release namespace>".
    matchers: ""
    # -- Each alert's runbook_url is this URL plus "#<alert name in lower case>".
    # Point it at your own copy of docs/monitoring-eks.md if you keep runbooks internally.
    runbookBaseURL: https://github.com/ByronGary/kubesentry/blob/main/docs/monitoring-eks.md
    # -- Alert when the served view is older than this.
    snapshotStaleSeconds: 120
    # -- Alert when the 90th percentile of view rebuilds over 15 minutes takes longer than this.
    snapshotBuildSeconds: 5
    # -- Alert when the CloudWatch reader lags more than this (only with the CloudWatch source).
    cloudwatchLagSeconds: 300
    # -- Alert when more than this fraction of SubjectAccessReviews fail.
    authzErrorRatio: 0.05
    # -- Alert when a replica's SubjectAccessReview rate stays above this
    # fraction of auth.authzQPS (the per-replica budget; proxy mode only).
    authzBudgetRatio: 0.8
    # -- Alert when the response cache hit ratio over 30 minutes falls below
    # this fraction of its ratio over the last day...
    cacheHitCollapseRatio: 0.5
    # -- ...while the cache sees at least this many lookups per second.
    cacheMinLookupsPerSecond: 0.5
    # -- Alert when more than this fraction of a route's requests are answered
    # 429 (or 503)...
    rejectedRatio: 0.05
    # -- ...at no less than this many responses per second.
    rejectedMinPerSecond: 0.05
    # -- Alert when the Postgres audit write queue holds more than this fraction
    # of auditQueueCapacity (only with audit.store=postgres).
    auditQueueRatio: 0.8
    # -- Capacity of the Postgres audit write queue. The server fixes it at
    # 50,000 events; keep this in step if that changes.
    auditQueueCapacity: 50000
    # -- Alert when nodes reporting processes drop by more than this fraction within an hour.
    agentDropRatio: 0.2
    # -- Crash-loop and OOM alerts for the release's pods (server, oauth2-proxy
    # and agent containers), from kube-state-metrics series.
    kubeStateMetrics:
      enabled: true
      # -- Extra label matchers for kube-state-metrics series, e.g. job="kube-state-metrics"
      # or cluster="prod-eks" when one Prometheus holds several clusters.
      matchers: ""
      # -- Restarts within 30 minutes that count as a crash loop.
      restarts: 3
    # -- Extra rules appended to the group.
    extraRules: []
  # -- Grafana dashboards as ConfigMaps, for the Grafana dashboard sidecar
  # (kube-prometheus-stack's grafana.sidecar.dashboards). The JSON uses a
  # ${datasource} variable, so it works with Prometheus or Amazon Managed
  # Prometheus behind Amazon Managed Grafana.
  grafanaDashboards:
    enabled: false
    # -- Namespace for the ConfigMaps; empty uses the release namespace. The
    # sidecar must watch it (kube-prometheus-stack searches ALL by default).
    namespace: ""
    # -- The label and value the sidecar selects ConfigMaps by
    # (grafana.sidecar.dashboards.label and labelValue).
    label: grafana_dashboard
    labelValue: "1"
    # -- Extra labels for the ConfigMaps.
    labels: {}
    # -- Annotations for the ConfigMaps, e.g. grafana_folder: kubesentry with
    # the sidecar's folderAnnotation set to grafana_folder.
    annotations: {}

# -- API Priority and Fairness: a FlowSchema and PriorityLevelConfiguration
# that isolate kubesentry's ServiceAccount from other API server clients.
apf:
  enabled: false
  matchingPrecedence: 1000
  nominalConcurrencyShares: 20
  lendablePercent: 50
  queues: 16
  handSize: 4
  queueLengthLimit: 50
