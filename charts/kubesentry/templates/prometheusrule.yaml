{{- $pr := .Values.metrics.prometheusRule -}}
{{- if and $pr.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PrometheusRule") }}
{{- $m := default (printf "namespace=%q" .Release.Namespace) $pr.matchers -}}
{{- $rb := $pr.runbookBaseURL -}}
{{- /* kube-state-metrics selector for the release's own containers. */ -}}
{{- $ksm := $pr.kubeStateMetrics -}}
{{- $podNamespaces := list .Release.Namespace -}}
{{- $containers := list "server" -}}
{{- if .Values.oauth2Proxy.enabled }}{{ $containers = append $containers "oauth2-proxy" }}{{ end -}}
{{- if .Values.agent.enabled -}}
{{- $containers = append $containers "agent" -}}
{{- $agentNS := include "kubesentry.agentNamespace" . -}}
{{- if ne $agentNS .Release.Namespace }}{{ $podNamespaces = append $podNamespaces $agentNS }}{{ end -}}
{{- end -}}
{{- $ksmSel := printf "namespace=~%q,pod=~%q,container=~%q" (join "|" $podNamespaces) (printf "%s-.+" (include "kubesentry.fullname" .)) (join "|" $containers) -}}
{{- with $ksm.matchers }}{{ $ksmSel = printf "%s,%s" . $ksmSel }}{{ end -}}
{{- $qps := include "kubesentry.scalar" (default 200 .Values.auth.authzQPS) -}}
{{- $responseCache := not (and (kindIs "bool" .Values.server.cache) (not .Values.server.cache)) -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kubesentry.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubesentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
    {{- with $pr.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kubesentry
      rules:
        - alert: KubesentrySnapshotStale
          expr: max by (namespace, pod) ({{ printf "kubesentry_snapshot_age_seconds{%s}" $m }}) > {{ $pr.snapshotStaleSeconds }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: kubesentry is serving a stale view of the cluster.
            description: >-
              {{ "{{" }} $labels.pod {{ "}}" }} has served a snapshot older than {{ $pr.snapshotStaleSeconds }}s for 5 minutes.
              Its informers are not keeping up with the API server, or the API server is unreachable.
            runbook_url: {{ $rb }}#kubesentrysnapshotstale
        - alert: KubesentrySnapshotBuildSlow
          expr: |
            histogram_quantile(0.9, sum by (namespace, pod, le) (rate({{ printf "kubesentry_snapshot_build_seconds_bucket{%s}" $m }}[15m])))
              > {{ include "kubesentry.scalar" $pr.snapshotBuildSeconds }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: kubesentry takes too long to rebuild its view of the cluster.
            description: >-
              On {{ "{{" }} $labels.pod {{ "}}" }}, 90% of view rebuilds over 15 minutes took up to {{ "{{" }} $value | humanizeDuration {{ "}}" }}
              (threshold {{ include "kubesentry.scalar" $pr.snapshotBuildSeconds }}s), so changes reach the UI late and CPU is spent on rebuilds.
              Usually the cluster grew past the replica's CPU or memory, or object churn is high.
            runbook_url: {{ $rb }}#kubesentrysnapshotbuildslow
        {{- if .Values.audit.sources.cloudwatch.enabled }}
        - alert: KubesentryCloudWatchLag
          expr: max by (namespace) ({{ printf "kubesentry_cloudwatch_lag_seconds{%s}" $m }}) > {{ $pr.cloudwatchLagSeconds }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: kubesentry's CloudWatch audit reader is behind.
            description: >-
              Audit events from CloudWatch Logs are more than {{ $pr.cloudwatchLagSeconds }}s behind.
              Check for throttling (FilterLogEvents quota), IAM errors, and that one replica holds the reader lock.
            runbook_url: {{ $rb }}#kubesentrycloudwatchlag
        {{- end }}
        {{- if eq .Values.audit.store "postgres" }}
        - alert: KubesentryPostgresErrors
          expr: sum by (namespace, pod) (rate({{ printf "kubesentry_audit_store_errors_total{%s}" $m }}[5m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: kubesentry cannot write audit events to Postgres.
            description: >-
              {{ "{{" }} $labels.pod {{ "}}" }} has failed audit store operations for 10 minutes.
              Events queue in memory and the webhook answers 503 once the queue is full.
            runbook_url: {{ $rb }}#kubesentrypostgreserrors
        - alert: KubesentryAuditQueueFilling
          expr: |
            max by (namespace, pod) ({{ printf "kubesentry_audit_queue_depth{%s}" $m }})
              > {{ include "kubesentry.scalar" $pr.auditQueueRatio }} * {{ include "kubesentry.scalar" $pr.auditQueueCapacity }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: kubesentry's audit write queue is nearly full.
            description: >-
              {{ "{{" }} $labels.pod {{ "}}" }} has held {{ "{{" }} $value | humanize {{ "}}" }} audit events waiting for Postgres for 10 minutes,
              more than {{ round (mulf $pr.auditQueueRatio 100) 1 }}% of its {{ include "kubesentry.scalar" $pr.auditQueueCapacity }}-event queue.
              When it is full, the audit webhook answers 503 and the CloudWatch reader falls behind (nothing is lost).
            runbook_url: {{ $rb }}#kubesentryauditqueuefilling
        {{- end }}
        - alert: KubesentryAuthzReviewErrors
          expr: |
            sum by (namespace) (rate({{ printf "kubesentry_authz_reviews_total{%s,result=\"error\"}" $m }}[5m]))
              / sum by (namespace) (rate({{ printf "kubesentry_authz_reviews_total{%s}" $m }}[5m]))
              > {{ $pr.authzErrorRatio }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: kubesentry's SubjectAccessReviews are failing.
            description: >-
              More than {{ mulf $pr.authzErrorRatio 100 }}% of SubjectAccessReviews failed over 10 minutes, so users see
              less than their RBAC allows. Check API server health and APF throttling of kubesentry's ServiceAccount.
            runbook_url: {{ $rb }}#kubesentryauthzreviewerrors
        {{- if eq (include "kubesentry.authMode" .) "proxy" }}
        - alert: KubesentryAuthzBudgetNearLimit
          expr: |
            sum by (namespace, pod) (rate({{ printf "kubesentry_authz_reviews_total{%s}" $m }}[5m]))
              > {{ include "kubesentry.scalar" $pr.authzBudgetRatio }} * {{ $qps }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: kubesentry is close to its SubjectAccessReview budget.
            description: >-
              {{ "{{" }} $labels.pod {{ "}}" }} sends {{ "{{" }} $value | humanize {{ "}}" }} SubjectAccessReviews per second, above
              {{ round (mulf $pr.authzBudgetRatio 100) 1 }}% of its budget of {{ $qps }}/s (auth.authzQPS, per replica). At the budget,
              reviews queue and pages slow down for every user while CPU stays low.
            runbook_url: {{ $rb }}#kubesentryauthzbudgetnearlimit
        {{- end }}
        {{- if $responseCache }}
        - alert: KubesentryCacheHitRateCollapsed
          expr: |
            (
              sum by (namespace) (rate({{ printf "kubesentry_http_cache_total{%s,result=~\"hit|coalesced\"}" $m }}[30m]))
                / sum by (namespace) (rate({{ printf "kubesentry_http_cache_total{%s,result=~\"hit|coalesced|miss\"}" $m }}[30m]))
              < {{ include "kubesentry.scalar" $pr.cacheHitCollapseRatio }} * (
                sum by (namespace) (rate({{ printf "kubesentry_http_cache_total{%s,result=~\"hit|coalesced\"}" $m }}[1d]))
                  / sum by (namespace) (rate({{ printf "kubesentry_http_cache_total{%s,result=~\"hit|coalesced|miss\"}" $m }}[1d]))
              )
            )
            and
            sum by (namespace) (rate({{ printf "kubesentry_http_cache_total{%s,result=~\"hit|coalesced|miss\"}" $m }}[30m]))
              > {{ include "kubesentry.scalar" $pr.cacheMinLookupsPerSecond }}
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: kubesentry's response cache hit rate collapsed.
            description: >-
              The response cache in {{ "{{" }} $labels.namespace {{ "}}" }} answered {{ "{{" }} $value | humanizePercentage {{ "}}" }} of lookups
              from cache over 30 minutes, less than {{ round (mulf $pr.cacheHitCollapseRatio 100) 1 }}% of its hit ratio over the last day.
              Every miss runs the handler and its authorization checks, so CPU and SubjectAccessReviews rise.
            runbook_url: {{ $rb }}#kubesentrycachehitratecollapsed
        {{- end }}
        - alert: KubesentryRateLimited
          expr: |
            sum by (namespace, route) (rate({{ printf "kubesentry_http_requests_total{%s,code=\"429\",route!=\"auth_recheck\"}" $m }}[10m]))
              > {{ include "kubesentry.scalar" $pr.rejectedMinPerSecond }}
            and
            sum by (namespace, route) (rate({{ printf "kubesentry_http_requests_total{%s,code=\"429\",route!=\"auth_recheck\"}" $m }}[10m]))
              / sum by (namespace, route) (rate({{ printf "kubesentry_http_requests_total{%s}" $m }}[10m]))
              > {{ include "kubesentry.scalar" $pr.rejectedRatio }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: kubesentry is answering 429 Too Many Requests on a route.
            description: >-
              The {{ "{{" }} $labels.route {{ "}}" }} route has answered 429 at {{ "{{" }} printf "%.2f" $value {{ "}}" }}/s, more than
              {{ round (mulf $pr.rejectedRatio 100) 1 }}% of its requests, for 15 minutes. Users hit the per-identity cap on expensive
              routes (server.maxInflightPerIdentity), usually because the backend behind it (Prometheus or Postgres) is slow.
            runbook_url: {{ $rb }}#kubesentryratelimited
        - alert: KubesentryServiceUnavailable
          expr: |
            sum by (namespace, route) (rate({{ printf "kubesentry_http_requests_total{%s,code=\"503\"}" $m }}[10m]))
              > {{ include "kubesentry.scalar" $pr.rejectedMinPerSecond }}
            and
            sum by (namespace, route) (rate({{ printf "kubesentry_http_requests_total{%s,code=\"503\"}" $m }}[10m]))
              / sum by (namespace, route) (rate({{ printf "kubesentry_http_requests_total{%s}" $m }}[10m]))
              > {{ include "kubesentry.scalar" $pr.rejectedRatio }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: kubesentry is answering 503 Service Unavailable on a route.
            description: >-
              The {{ "{{" }} $labels.route {{ "}}" }} route has answered 503 at {{ "{{" }} printf "%.2f" $value {{ "}}" }}/s, more than
              {{ round (mulf $pr.rejectedRatio 100) 1 }}% of its requests, for 15 minutes: route timeouts, an overloaded audit store,
              a full audit write queue (ingest_audit_webhook), or an ingest route without its token.
            runbook_url: {{ $rb }}#kubesentryserviceunavailable
        {{- if .Values.agent.enabled }}
        - alert: KubesentryAgentNodesDropped
          expr: |
            max by (namespace) ({{ printf "kubesentry_agent_nodes_reporting{%s}" $m }})
              < {{ subf 1 $pr.agentDropRatio }} * max by (namespace) (max_over_time({{ printf "kubesentry_agent_nodes_reporting{%s}" $m }}[1h]))
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Fewer nodes report processes to kubesentry.
            description: >-
              Nodes reporting processes dropped by more than {{ mulf $pr.agentDropRatio 100 }}% within an hour.
              Agents may be failing, or the cluster scaled down. Compare with the agent DaemonSet's ready count.
            runbook_url: {{ $rb }}#kubesentryagentnodesdropped
        {{- end }}
        {{- if $ksm.enabled }}
        - alert: KubesentryCrashLooping
          expr: |
            max by (namespace, pod, container) (max_over_time({{ printf "kube_pod_container_status_waiting_reason{%s,reason=\"CrashLoopBackOff\"}" $ksmSel }}[5m])) >= 1
            or
            max by (namespace, pod, container) (increase({{ printf "kube_pod_container_status_restarts_total{%s}" $ksmSel }}[30m])) >= {{ $ksm.restarts }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: A kubesentry container is crash-looping.
            description: >-
              {{ "{{" }} $labels.container {{ "}}" }} in {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} is in CrashLoopBackOff
              or restarted at least {{ $ksm.restarts }} times in 30 minutes. A restarting server rebuilds its caches; with the memory
              audit store it also loses its audit history.
            runbook_url: {{ $rb }}#kubesentrycrashlooping
        - alert: KubesentryOOMKilled
          expr: |
            max by (namespace, pod, container) ({{ printf "kube_pod_container_status_last_terminated_reason{%s,reason=\"OOMKilled\"}" $ksmSel }}) == 1
            and on (namespace, pod, container)
            max by (namespace, pod, container) (increase({{ printf "kube_pod_container_status_restarts_total{%s}" $ksmSel }}[30m])) > 0
          labels:
            severity: warning
          annotations:
            summary: A kubesentry container was OOM-killed.
            description: >-
              {{ "{{" }} $labels.container {{ "}}" }} in {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} restarted in the last
              30 minutes after running out of memory. Its memory limit is too small for the cluster's size or for the agents' report bursts.
            runbook_url: {{ $rb }}#kubesentryoomkilled
        {{- end }}
        {{- with $pr.extraRules }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
