{{- if .Values.serviceAccount.create }}
# IRSA: annotate with eks.amazonaws.com/role-arn. EKS Pod Identity: no
# annotation; associate a role with this ServiceAccount
# (aws eks create-pod-identity-association, docs/deploy-eks.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubesentry.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubesentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
