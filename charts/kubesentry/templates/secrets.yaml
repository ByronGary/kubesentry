{{- /*
Bearer tokens. Each is generated once and kept across upgrades: Helm's lookup
reads the existing Secret and its value is re-rendered unchanged. A token whose
tokens.<name>.existingSecret is set is not rendered at all.

lookup returns nothing under `helm template` and `--dry-run=client`, so those
always show freshly generated values.
*/ -}}
{{- $fullname := include "kubesentry.fullname" . -}}
{{- $agentNS := include "kubesentry.agentNamespace" . -}}
{{- $wanted := list -}}
{{- if and .Values.tokens.api.enabled (not .Values.tokens.api.existingSecret) -}}
{{- $wanted = append $wanted (dict "name" (printf "%s-api" $fullname) "key" .Values.tokens.api.key "use" "API token (-api-token): break-glass access to /api/" "copyTo" "") -}}
{{- end -}}
{{- if and .Values.agent.enabled (not .Values.tokens.agent.existingSecret) -}}
{{- $wanted = append $wanted (dict "name" (printf "%s-agent" $fullname) "key" .Values.tokens.agent.key "use" "Agent token (-agent-token): authenticates node agents' reports" "copyTo" $agentNS) -}}
{{- end -}}
{{- if and .Values.audit.sources.webhook.enabled (not .Values.tokens.audit.existingSecret) -}}
{{- $wanted = append $wanted (dict "name" (printf "%s-audit" $fullname) "key" .Values.tokens.audit.key "use" "Audit webhook token (-audit-token)" "copyTo" "") -}}
{{- end -}}
{{- range $t := $wanted }}
{{- $value := "" -}}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $t.name -}}
{{- if and $existing $existing.data (hasKey $existing.data $t.key) -}}
{{- $value = index $existing.data $t.key -}}
{{- end -}}
{{- $namespaces := list $.Release.Namespace -}}
{{- if and $t.copyTo (ne $t.copyTo $.Release.Namespace) -}}
{{- $namespaces = append $namespaces $t.copyTo -}}
{{- if not $value -}}
{{- $copy := lookup "v1" "Secret" $t.copyTo $t.name -}}
{{- if and $copy $copy.data (hasKey $copy.data $t.key) -}}
{{- $value = index $copy.data $t.key -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if not $value -}}
{{- $value = randAlphaNum 64 | b64enc -}}
{{- end -}}
{{- range $ns := $namespaces }}
---
# {{ $t.use }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $t.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "kubesentry.labels" $ | nindent 4 }}
type: Opaque
data:
  {{ $t.key }}: {{ $value }}
{{- end }}
{{- end }}
