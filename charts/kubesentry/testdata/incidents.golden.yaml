---
# Source: kubesentry/templates/configmap.yaml
# Request profiles of your own, read by -incident-request-profiles-file.
# kubesentry builds the PromQL from them (with -prometheus-selector); a
# profile names labels, never a query.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubesentry-incidents
  namespace: kubesentry
  labels:
    helm.sh/chart: kubesentry-0.1.0
    app.kubernetes.io/name: kubesentry
    app.kubernetes.io/instance: kubesentry
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubesentry
    app.kubernetes.io/component: server
data:
  request-profiles.json: |
    [
      {
        "metric": "envoy_cluster_upstream_rq_total",
        "name": "envoy",
        "namespaceLabel": "namespace",
        "serviceLabel": "service",
        "statusLabel": "response_code"
      }
    ]

---
# Source: kubesentry/templates/rbac.yaml
# Read-only access to everything kubesentry watches. Secrets are deliberately
# absent: kubesentry never reads them (the cert-manager page uses Certificate
# status, not the issued Secret).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubesentry
  labels:
    helm.sh/chart: kubesentry-0.1.0
    app.kubernetes.io/name: kubesentry
    app.kubernetes.io/instance: kubesentry
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubesentry
    app.kubernetes.io/component: server
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "persistentvolumes", "services", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  # The IRSA role annotations (eks.amazonaws.com/role-arn) that tie CloudTrail
  # changes to workloads; only ServiceAccounts with one are kept.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["list", "watch"]
  # Optional: without cert-manager the Certificates page reports it as not installed.
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "certificaterequests", "issuers", "clusterissuers"]
    verbs: ["get", "list", "watch"]
  # Optional: AWS Load Balancer Controller target groups, for ALB metrics and
  # CloudTrail changes on incidents.
  - apiGroups: ["elbv2.k8s.aws"]
    resources: ["targetgroupbindings"]
    verbs: ["list", "watch"]
  # Incidents: Warning events (and the Normal reasons kept), watched by the
  # replica running the incidents engine.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch"]
  # Incidents: container logs, read when a user who may read them (get
  # pods/log, checked per namespace) opens an incident.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Per-user scoping asks the API server what each signed-in user may see, and
  # the startup probe checks kubesentry's own access per resource.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews", "selfsubjectaccessreviews"]
    verbs: ["create"]

