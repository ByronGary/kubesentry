# Source: kubesentry/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubesentry
  namespace: kubesentry
  labels:
    helm.sh/chart: kubesentry-0.1.0
    app.kubernetes.io/name: kubesentry
    app.kubernetes.io/instance: kubesentry
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubesentry
    app.kubernetes.io/component: server
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: kubesentry
      app.kubernetes.io/instance: kubesentry
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubesentry
        app.kubernetes.io/instance: kubesentry
        app.kubernetes.io/component: server
        app.kubernetes.io/version: "0.1.0"
      annotations:
        kubectl.kubernetes.io/default-container: server
    spec:
      serviceAccountName: kubesentry
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - topologyKey: topology.kubernetes.io/zone
          maxSkew: 1
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kubesentry
              app.kubernetes.io/instance: kubesentry
              app.kubernetes.io/component: server
          matchLabelKeys:
            - pod-template-hash
        - topologyKey: kubernetes.io/hostname
          maxSkew: 1
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kubesentry
              app.kubernetes.io/instance: kubesentry
              app.kubernetes.io/component: server
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: server
          image: ghcr.io/byrongary/kubesentry:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - -addr=:8080
            - -ingest-addr=:8081
            - -ops-addr=:9090
            - -auth-mode=token
            - -agent-interval=15s
            - -owner-annotation=kubesentry.io/owner
            - -production-label=environment=production
            - -prometheus-autodiscover=true
            - -audit-store=memory
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The Settings page's setup steps name kubesentry's service account.
            - name: KUBESENTRY_SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            # GOMEMLIMIT is left unset on purpose: the server sets it to 90% of the
            # cgroup memory limit, leaving headroom for non-heap memory.
            - name: KUBESENTRY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kubesentry-api
                  key: token
            - name: KUBESENTRY_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kubesentry-agent
                  key: token
          ports:
            - name: web
              containerPort: 8080
              protocol: TCP
            - name: ingest
              containerPort: 8081
              protocol: TCP
            - name: ops
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
          lifecycle:
            preStop:
              # Keep serving while the load balancer deregisters this pod.
              sleep:
                seconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
