apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubesentry-audit-viewer
  labels:
    helm.sh/chart: kubesentry-0.1.0
    app.kubernetes.io/name: kubesentry
    app.kubernetes.io/instance: kubesentry
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubesentry
rules:
  - apiGroups: ["kubesentry.io"]
    resources: ["auditevents"]
    verbs: ["list"]

