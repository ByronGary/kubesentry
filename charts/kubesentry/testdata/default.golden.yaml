---
# Source: kubesentry/templates/agent.yaml
# Node agent: reports the processes inside pods. It reads
# /proc/<pid>/{cgroup,stat,statm,cmdline} of pod processes only, never
# environment variables, files or memory, and redacts command lines. hostPID is
# its only host access: it is not privileged, runs as non-root and mounts
# nothing from the host.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubesentry-agent
  namespace: kubesentry
  labels:
    helm.sh/chart: kubesentry-0.1.0
    app.kubernetes.io/name: kubesentry
    app.kubernetes.io/instance: kubesentry
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubesentry
    app.kubernetes.io/component: agent
spec:
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: kubesentry
      app.kubernetes.io/instance: kubesentry
      app.kubernetes.io/component: agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubesentry
        app.kubernetes.io/instance: kubesentry
        app.kubernetes.io/component: agent
        app.kubernetes.io/version: "0.1.0"
    spec:
      serviceAccountName: kubesentry-agent
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostPID: true
      priorityClassName: system-node-critical
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values: ["linux"]
                  # Fargate runs no DaemonSets; its virtual nodes would leave pods Pending.
                  - key: eks.amazonaws.com/compute-type
                    operator: NotIn
                    values: ["fargate"]
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: ghcr.io/byrongary/kubesentry-agent:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - -server=http://kubesentry-ingest.kubesentry.svc:8081
            - -server-fanout=kubesentry-ingest-headless.kubesentry.svc
            - -interval=15s
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KUBESENTRY_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kubesentry-agent
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 20m
              memory: 32Mi

---
# Source: kubesentry/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubesentry
  namespace: kubesentry
  labels:
    helm.sh/chart: kubesentry-0.1.0
    app.kubernetes.io/name: kubesentry
    app.kubernetes.io/instance: kubesentry
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubesentry
    app.kubernetes.io/component: server
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: kubesentry
      app.kubernetes.io/instance: kubesentry
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubesentry
        app.kubernetes.io/instance: kubesentry
        app.kubernetes.io/component: server
        app.kubernetes.io/version: "0.1.0"
      annotations:
        kubectl.kubernetes.io/default-container: server
    spec:
      serviceAccountName: kubesentry
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - topologyKey: topology.kubernetes.io/zone
          maxSkew: 1
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kubesentry
              app.kubernetes.io/instance: kubesentry
              app.kubernetes.io/component: server
          matchLabelKeys:
            - pod-template-hash
        - topologyKey: kubernetes.io/hostname
          maxSkew: 1
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kubesentry
              app.kubernetes.io/instance: kubesentry
              app.kubernetes.io/component: server
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: server
          image: ghcr.io/byrongary/kubesentry:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - -addr=:8080
            - -ingest-addr=:8081
            - -ops-addr=:9090
            - -auth-mode=token
            - -owner-annotation=kubesentry.io/owner
            - -production-label=environment=production
            - -prometheus-autodiscover=true
            - -audit-store=memory
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # GOMEMLIMIT is left unset on purpose: the server sets it to 90% of the
            # cgroup memory limit, leaving headroom for non-heap memory.
            - name: KUBESENTRY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kubesentry-api
                  key: token
            - name: KUBESENTRY_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kubesentry-agent
                  key: token
          ports:
            - name: web
              containerPort: 8080
              protocol: TCP
            - name: ingest
              containerPort: 8081
              protocol: TCP
            - name: ops
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
          lifecycle:
            preStop:
              # Keep serving while the load balancer deregisters this pod.
              sleep:
                seconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
