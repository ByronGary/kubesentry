---
# Source: kubesentry/templates/agent.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubesentry-agent
  namespace: kubesentry
  labels:
    helm.sh/chart: kubesentry-0.1.0
    app.kubernetes.io/name: kubesentry
    app.kubernetes.io/instance: kubesentry
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubesentry
    app.kubernetes.io/component: agent
# The agent never talks to the Kubernetes API.
automountServiceAccountToken: false

---
# Source: kubesentry/templates/serviceaccount.yaml
# IRSA: annotate with eks.amazonaws.com/role-arn. EKS Pod Identity: no
# annotation; associate a role with this ServiceAccount
# (aws eks create-pod-identity-association, docs/deploy-eks.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubesentry
  namespace: kubesentry
  labels:
    helm.sh/chart: kubesentry-0.1.0
    app.kubernetes.io/name: kubesentry
    app.kubernetes.io/instance: kubesentry
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubesentry
    app.kubernetes.io/component: server
automountServiceAccountToken: false

---
# Source: kubesentry/templates/secrets.yaml
# API token (-api-token): break-glass access to /api/
apiVersion: v1
kind: Secret
metadata:
  name: kubesentry-api
  namespace: kubesentry
  labels:
    helm.sh/chart: kubesentry-0.1.0
    app.kubernetes.io/name: kubesentry
    app.kubernetes.io/instance: kubesentry
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubesentry
type: Opaque
data:
  token: <generated>

---
# Source: kubesentry/templates/secrets.yaml
# Agent token (-agent-token): authenticates node agents' reports
apiVersion: v1
kind: Secret
metadata:
  name: kubesentry-agent
  namespace: kubesentry
  labels:
    helm.sh/chart: kubesentry-0.1.0
    app.kubernetes.io/name: kubesentry
    app.kubernetes.io/instance: kubesentry
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubesentry
type: Opaque
data:
  token: <generated>

---
# Source: kubesentry/templates/rbac.yaml
# Read-only access to everything kubesentry watches. Secrets are deliberately
# absent: kubesentry never reads them (the cert-manager page uses Certificate
# status, not the issued Secret).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubesentry
  labels:
    helm.sh/chart: kubesentry-0.1.0
    app.kubernetes.io/name: kubesentry
    app.kubernetes.io/instance: kubesentry
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubesentry
    app.kubernetes.io/component: server
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "persistentvolumes", "services", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  # Optional: without cert-manager the Certificates page reports it as not installed.
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "certificaterequests", "issuers", "clusterissuers"]
    verbs: ["get", "list", "watch"]
  # Per-user scoping asks the API server what each signed-in user may see, and
  # the startup probe checks kubesentry's own access per resource.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews", "selfsubjectaccessreviews"]
    verbs: ["create"]

---
