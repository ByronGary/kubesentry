---
# Source: kubesentry/templates/agent.yaml
# Node agent: reports the processes inside pods. It reads
# /proc/<pid>/{cgroup,stat,statm,cmdline} of pod processes only, never
# environment variables, files or memory, and redacts command lines. hostPID is
# its only host access: it is not privileged, runs as non-root and mounts
# nothing from the host.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubesentry-agent
  namespace: kubesentry
  labels:
    helm.sh/chart: kubesentry-0.1.0
    app.kubernetes.io/name: kubesentry
    app.kubernetes.io/instance: kubesentry
    app.kubernetes.io/version: "dev"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubesentry
    app.kubernetes.io/component: agent
spec:
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: kubesentry
      app.kubernetes.io/instance: kubesentry
      app.kubernetes.io/component: agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubesentry
        app.kubernetes.io/instance: kubesentry
        app.kubernetes.io/component: agent
        app.kubernetes.io/version: "dev"
    spec:
      serviceAccountName: kubesentry-agent
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostPID: true
      priorityClassName: system-node-critical
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values: ["linux"]
                  # Fargate runs no DaemonSets; its virtual nodes would leave pods Pending.
                  - key: eks.amazonaws.com/compute-type
                    operator: NotIn
                    values: ["fargate"]
                  - key: type
                    operator: NotIn
                    values: ["kwok"]
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: kubesentry-agent:dev
          imagePullPolicy: IfNotPresent
          args:
            - -server=http://kubesentry-ingest.kubesentry.svc:8081
            - -server-fanout=kubesentry-ingest-headless.kubesentry.svc
            - -interval=15s
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KUBESENTRY_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kubesentry-agent
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 20m
              memory: 32Mi

---
# Source: kubesentry/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubesentry
  namespace: kubesentry
  labels:
    helm.sh/chart: kubesentry-0.1.0
    app.kubernetes.io/name: kubesentry
    app.kubernetes.io/instance: kubesentry
    app.kubernetes.io/version: "dev"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubesentry
    app.kubernetes.io/component: server
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubesentry
      app.kubernetes.io/instance: kubesentry
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubesentry
        app.kubernetes.io/instance: kubesentry
        app.kubernetes.io/component: server
        app.kubernetes.io/version: "dev"
      annotations:
        kubectl.kubernetes.io/default-container: server
    spec:
      serviceAccountName: kubesentry
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      containers:
        - name: server
          image: kubesentry:dev
          imagePullPolicy: IfNotPresent
          args:
            - -addr=:8080
            - -ingest-addr=:8081
            - -ops-addr=:9090
            - -cluster-name=kind-kubesentry
            - -auth-mode=token
            - -pvc-min-age=5m
            - -prometheus-autodiscover=true
            - -audit-store=memory
            - -audit-log-file=/var/log/kubernetes/audit/audit.log
            - -audit-from-start=true
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # GOMEMLIMIT is left unset on purpose: the server sets it to 90% of the
            # cgroup memory limit, leaving headroom for non-heap memory.
            - name: KUBESENTRY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kubesentry-api
                  key: token
            - name: KUBESENTRY_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kubesentry-agent
                  key: token
            - name: KUBESENTRY_AUDIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kubesentry-audit
                  key: token
          ports:
            - name: web
              containerPort: 8080
              protocol: TCP
            - name: ingest
              containerPort: 8081
              protocol: TCP
            - name: ops
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: audit-log
              mountPath: /var/log/kubernetes/audit
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: audit-log
          hostPath:
            path: /var/log/kubernetes/audit
            type: Directory

---
# Source: kubesentry/templates/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubesentry
  namespace: kubesentry
  labels:
    helm.sh/chart: kubesentry-0.1.0
    app.kubernetes.io/name: kubesentry
    app.kubernetes.io/instance: kubesentry
    app.kubernetes.io/version: "dev"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubesentry
    app.kubernetes.io/component: server
    release: kps
spec:
  groups:
    - name: kubesentry
      rules:
        - alert: KubesentrySnapshotStale
          expr: max by (namespace, pod) (kubesentry_snapshot_age_seconds{namespace="kubesentry"}) > 120
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: kubesentry is serving a stale view of the cluster.
            description: >-
              {{ $labels.pod }} has served a snapshot older than 120s for 5 minutes.
              Its informers are not keeping up with the API server, or the API server is unreachable.
            runbook_url: https://github.com/ByronGary/kubesentry/blob/main/docs/monitoring-eks.md#kubesentrysnapshotstale
        - alert: KubesentrySnapshotBuildSlow
          expr: |
            histogram_quantile(0.9, sum by (namespace, pod, le) (rate(kubesentry_snapshot_build_seconds_bucket{namespace="kubesentry"}[15m])))
              > 5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: kubesentry takes too long to rebuild its view of the cluster.
            description: >-
              On {{ $labels.pod }}, 90% of view rebuilds over 15 minutes took up to {{ $value | humanizeDuration }}
              (threshold 5s), so changes reach the UI late and CPU is spent on rebuilds.
              Usually the cluster grew past the replica's CPU or memory, or object churn is high.
            runbook_url: https://github.com/ByronGary/kubesentry/blob/main/docs/monitoring-eks.md#kubesentrysnapshotbuildslow
        - alert: KubesentryAuthzReviewErrors
          expr: |
            sum by (namespace) (rate(kubesentry_authz_reviews_total{namespace="kubesentry",result="error"}[5m]))
              / sum by (namespace) (rate(kubesentry_authz_reviews_total{namespace="kubesentry"}[5m]))
              > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: kubesentry's SubjectAccessReviews are failing.
            description: >-
              More than 5% of SubjectAccessReviews failed over 10 minutes, so users see
              less than their RBAC allows. Check API server health and APF throttling of kubesentry's ServiceAccount.
            runbook_url: https://github.com/ByronGary/kubesentry/blob/main/docs/monitoring-eks.md#kubesentryauthzreviewerrors
        - alert: KubesentryCacheHitRateCollapsed
          expr: |
            (
              sum by (namespace) (rate(kubesentry_http_cache_total{namespace="kubesentry",result=~"hit|coalesced"}[30m]))
                / sum by (namespace) (rate(kubesentry_http_cache_total{namespace="kubesentry",result=~"hit|coalesced|miss"}[30m]))
              < 0.5 * (
                sum by (namespace) (rate(kubesentry_http_cache_total{namespace="kubesentry",result=~"hit|coalesced"}[1d]))
                  / sum by (namespace) (rate(kubesentry_http_cache_total{namespace="kubesentry",result=~"hit|coalesced|miss"}[1d]))
              )
            )
            and
            sum by (namespace) (rate(kubesentry_http_cache_total{namespace="kubesentry",result=~"hit|coalesced|miss"}[30m]))
              > 0.5
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: kubesentry's response cache hit rate collapsed.
            description: >-
              The response cache in {{ $labels.namespace }} answered {{ $value | humanizePercentage }} of lookups
              from cache over 30 minutes, less than 50% of its hit ratio over the last day.
              Every miss runs the handler and its authorization checks, so CPU and SubjectAccessReviews rise.
            runbook_url: https://github.com/ByronGary/kubesentry/blob/main/docs/monitoring-eks.md#kubesentrycachehitratecollapsed
        - alert: KubesentryRateLimited
          expr: |
            sum by (namespace, route) (rate(kubesentry_http_requests_total{namespace="kubesentry",code="429",route!="auth_recheck"}[10m]))
              > 0.05
            and
            sum by (namespace, route) (rate(kubesentry_http_requests_total{namespace="kubesentry",code="429",route!="auth_recheck"}[10m]))
              / sum by (namespace, route) (rate(kubesentry_http_requests_total{namespace="kubesentry"}[10m]))
              > 0.05
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: kubesentry is answering 429 Too Many Requests on a route.
            description: >-
              The {{ $labels.route }} route has answered 429 at {{ printf "%.2f" $value }}/s, more than
              5% of its requests, for 15 minutes. Users hit the per-identity cap on expensive
              routes (server.maxInflightPerIdentity), usually because the backend behind it (Prometheus or Postgres) is slow.
            runbook_url: https://github.com/ByronGary/kubesentry/blob/main/docs/monitoring-eks.md#kubesentryratelimited
        - alert: KubesentryServiceUnavailable
          expr: |
            sum by (namespace, route) (rate(kubesentry_http_requests_total{namespace="kubesentry",code="503"}[10m]))
              > 0.05
            and
            sum by (namespace, route) (rate(kubesentry_http_requests_total{namespace="kubesentry",code="503"}[10m]))
              / sum by (namespace, route) (rate(kubesentry_http_requests_total{namespace="kubesentry"}[10m]))
              > 0.05
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: kubesentry is answering 503 Service Unavailable on a route.
            description: >-
              The {{ $labels.route }} route has answered 503 at {{ printf "%.2f" $value }}/s, more than
              5% of its requests, for 15 minutes: route timeouts, an overloaded audit store,
              a full audit write queue (ingest_audit_webhook), or an ingest route without its token.
            runbook_url: https://github.com/ByronGary/kubesentry/blob/main/docs/monitoring-eks.md#kubesentryserviceunavailable
        - alert: KubesentryAgentNodesDropped
          expr: |
            max by (namespace) (kubesentry_agent_nodes_reporting{namespace="kubesentry"})
              < 0.8 * max by (namespace) (max_over_time(kubesentry_agent_nodes_reporting{namespace="kubesentry"}[1h]))
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Fewer nodes report processes to kubesentry.
            description: >-
              Nodes reporting processes dropped by more than 20% within an hour.
              Agents may be failing, or the cluster scaled down. Compare with the agent DaemonSet's ready count.
            runbook_url: https://github.com/ByronGary/kubesentry/blob/main/docs/monitoring-eks.md#kubesentryagentnodesdropped
        - alert: KubesentryCrashLooping
          expr: |
            max by (namespace, pod, container) (max_over_time(kube_pod_container_status_waiting_reason{namespace=~"kubesentry",pod=~"kubesentry-.+",container=~"server|agent",reason="CrashLoopBackOff"}[5m])) >= 1
            or
            max by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total{namespace=~"kubesentry",pod=~"kubesentry-.+",container=~"server|agent"}[30m])) >= 3
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: A kubesentry container is crash-looping.
            description: >-
              {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} is in CrashLoopBackOff
              or restarted at least 3 times in 30 minutes. A restarting server rebuilds its caches; with the memory
              audit store it also loses its audit history.
            runbook_url: https://github.com/ByronGary/kubesentry/blob/main/docs/monitoring-eks.md#kubesentrycrashlooping
        - alert: KubesentryOOMKilled
          expr: |
            max by (namespace, pod, container) (kube_pod_container_status_last_terminated_reason{namespace=~"kubesentry",pod=~"kubesentry-.+",container=~"server|agent",reason="OOMKilled"}) == 1
            and on (namespace, pod, container)
            max by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total{namespace=~"kubesentry",pod=~"kubesentry-.+",container=~"server|agent"}[30m])) > 0
          labels:
            severity: warning
          annotations:
            summary: A kubesentry container was OOM-killed.
            description: >-
              {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} restarted in the last
              30 minutes after running out of memory. Its memory limit is too small for the cluster's size or for the agents' report bursts.
            runbook_url: https://github.com/ByronGary/kubesentry/blob/main/docs/monitoring-eks.md#kubesentryoomkilled

---
# Source: kubesentry/templates/servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubesentry
  namespace: kubesentry
  labels:
    helm.sh/chart: kubesentry-0.1.0
    app.kubernetes.io/name: kubesentry
    app.kubernetes.io/instance: kubesentry
    app.kubernetes.io/version: "dev"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubesentry
    app.kubernetes.io/component: server
    release: kps
spec:
  namespaceSelector:
    matchNames:
      - kubesentry
  selector:
    matchLabels:
      app.kubernetes.io/name: kubesentry
      app.kubernetes.io/instance: kubesentry
      app.kubernetes.io/component: server
      kubesentry.io/listener: ops
  endpoints:
    - port: ops
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
