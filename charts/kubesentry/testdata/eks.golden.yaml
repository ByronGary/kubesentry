---
# Source: kubesentry/templates/agent.yaml
# The agent needs hostPID, which only the "privileged" Pod Security level
# allows. Keeping it in its own namespace lets the server's namespace enforce
# "restricted".
apiVersion: v1
kind: Namespace
metadata:
  name: kubesentry-agent
  labels:
    helm.sh/chart: kubesentry-0.1.0
    app.kubernetes.io/name: kubesentry
    app.kubernetes.io/instance: kubesentry
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubesentry
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged

---
# Source: kubesentry/templates/networkpolicy.yaml
# Server pods: only the listed peers reach each listener. A listener with no
# allowed peers is closed (kubectl port-forward still works: it does not cross
# the pod network).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubesentry
  namespace: kubesentry
  labels:
    helm.sh/chart: kubesentry-0.1.0
    app.kubernetes.io/name: kubesentry
    app.kubernetes.io/instance: kubesentry
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubesentry
    app.kubernetes.io/component: server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubesentry
      app.kubernetes.io/instance: kubesentry
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Web (UI and API).
    - ports:
        - port: 4180
          protocol: TCP
      from:
        - ipBlock:
            cidr: 10.20.0.0/22
        - ipBlock:
            cidr: 10.20.4.0/22
        - ipBlock:
            cidr: 10.20.8.0/22
    # Ingest (agent reports, audit webhook).
    - ports:
        - port: 8081
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kubesentry
              app.kubernetes.io/instance: kubesentry
              app.kubernetes.io/component: agent
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kubesentry-agent
    # Ops (/metrics).
    - ports:
        - port: 9090
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: amazon-cloudwatch
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
  egress:
    # DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Kubernetes API server, AWS APIs (STS, CloudWatch Logs, AMP) and the IdP.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
    # Postgres (audit store).
    - to:
        - ipBlock:
            cidr: 10.20.32.0/22
        - ipBlock:
            cidr: 10.20.36.0/22
      ports:
        - port: 5432
          protocol: TCP
    # Redis (oauth2-proxy sessions).
    - to:
        - ipBlock:
            cidr: 10.20.40.0/22
      ports:
        - port: 6379
          protocol: TCP

