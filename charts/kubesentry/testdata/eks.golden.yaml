---
# Source: kubesentry/templates/agent.yaml
# Node agent: reports the processes inside pods. It reads
# /proc/<pid>/{cgroup,stat,statm,cmdline} of pod processes only, never
# environment variables, files or memory, and redacts command lines. hostPID is
# its only host access: it is not privileged, runs as non-root and mounts
# nothing from the host.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubesentry-agent
  namespace: kubesentry-agent
  labels:
    helm.sh/chart: kubesentry-0.1.0
    app.kubernetes.io/name: kubesentry
    app.kubernetes.io/instance: kubesentry
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubesentry
    app.kubernetes.io/component: agent
spec:
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: kubesentry
      app.kubernetes.io/instance: kubesentry
      app.kubernetes.io/component: agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubesentry
        app.kubernetes.io/instance: kubesentry
        app.kubernetes.io/component: agent
        app.kubernetes.io/version: "0.1.0"
    spec:
      serviceAccountName: kubesentry-agent
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostPID: true
      priorityClassName: system-node-critical
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values: ["linux"]
                  # Fargate runs no DaemonSets; its virtual nodes would leave pods Pending.
                  - key: eks.amazonaws.com/compute-type
                    operator: NotIn
                    values: ["fargate"]
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: ghcr.io/byrongary/kubesentry-agent:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - -server=http://kubesentry-ingest.kubesentry.svc:8081
            - -server-fanout=kubesentry-ingest-headless.kubesentry.svc
            - -interval=15s
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KUBESENTRY_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kubesentry-agent
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 20m
              memory: 32Mi

---
# Source: kubesentry/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubesentry
  namespace: kubesentry
  labels:
    helm.sh/chart: kubesentry-0.1.0
    app.kubernetes.io/name: kubesentry
    app.kubernetes.io/instance: kubesentry
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubesentry
    app.kubernetes.io/component: server
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: kubesentry
      app.kubernetes.io/instance: kubesentry
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubesentry
        app.kubernetes.io/instance: kubesentry
        app.kubernetes.io/component: server
        app.kubernetes.io/version: "0.1.0"
      annotations:
        kubectl.kubernetes.io/default-container: server
        checksum/group-map: dbf1c18857fd60a8bc21fd9e3648fb9c1691817d5538dfcb10b1435b2070270c
    spec:
      serviceAccountName: kubesentry
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - topologyKey: topology.kubernetes.io/zone
          maxSkew: 1
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kubesentry
              app.kubernetes.io/instance: kubesentry
              app.kubernetes.io/component: server
          matchLabelKeys:
            - pod-template-hash
        - topologyKey: kubernetes.io/hostname
          maxSkew: 1
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kubesentry
              app.kubernetes.io/instance: kubesentry
              app.kubernetes.io/component: server
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: server
          image: ghcr.io/byrongary/kubesentry:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - -addr=unix:///var/run/kubesentry/web.sock
            - -ingest-addr=:8081
            - -ops-addr=:9090
            - -cluster-name=prod-eks
            - -auth-mode=proxy
            - -auth-user-header=X-Forwarded-Email
            - -auth-groups-header=X-Forwarded-Groups
            - -auth-group-map-file=/etc/kubesentry/auth/group-map.json
            - -authz-qps=200
            - -authz-cache-ttl=5m
            - -authz-deny-ttl=1m
            - -authz-share-by-groups=true
            - -system-namespaces-add=cert-manager,external-secrets,monitoring,kubesentry-agent
            - -ebs-prices=gp2=0.1,gp3=0.08,io2=0.125
            - -prometheus-url=https://aps-workspaces.us-east-1.amazonaws.com/workspaces/ws-12345678-abcd-1234-abcd-123456789012
            - -prometheus-sigv4=true
            - -prometheus-selector=cluster="prod-eks"
            - -aws-region=us-east-1
            - -audit-store=postgres
            - -pg-schema=prod_eks
            - -audit-retention=30d
            - -audit-redact-exec-args=true
            - -cloudwatch=true
            - -cloudwatch-log-group=/aws/eks/prod-eks/cluster
            - -cloudwatch-start=24h
            - -aws-auth=true
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # GOMEMLIMIT is left unset on purpose: the server sets it to 90% of the
            # cgroup memory limit, leaving headroom for non-heap memory.
            - name: AWS_REGION
              value: "us-east-1"
            - name: KUBESENTRY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kubesentry-api
                  key: token
            - name: KUBESENTRY_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kubesentry-agent
                  key: token
            - name: KUBESENTRY_PG_DSN
              valueFrom:
                secretKeyRef:
                  name: kubesentry-pg
                  key: dsn
            - name: PGSSLMODE
              value: "verify-full"
            - name: PGSSLROOTCERT
              value: /etc/kubesentry/pg-ca/global-bundle.pem
          ports:
            - name: ingest
              containerPort: 8081
              protocol: TCP
            - name: ops
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
          lifecycle:
            preStop:
              # Keep serving while the load balancer deregisters this pod.
              sleep:
                seconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              memory: 1536Mi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: web-socket
              mountPath: /var/run/kubesentry
            - name: auth-group-map
              mountPath: /etc/kubesentry/auth
              readOnly: true
            - name: pg-ca
              mountPath: /etc/kubesentry/pg-ca
              readOnly: true
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
          imagePullPolicy: IfNotPresent
          args:
            - --http-address=0.0.0.0:4180
            # kubesentry listens only on this socket, in a volume only these two
            # containers mount; it trusts identity headers on it and nowhere else.
            - --upstream=unix:///var/run/kubesentry/web.sock
            - --provider=oidc
            - --oidc-issuer-url=https://example.okta.com/oauth2/default
            - --client-id=0oa1example2kubesentry3
            - --redirect-url=https://kubesentry.prod.example.com/oauth2/callback
            - --scope=openid email profile groups
            - --oidc-groups-claim=groups
            - --oidc-email-claim=email
            - --code-challenge-method=S256
            - --email-domain=*
            - --allowed-group=platform-team
            - --allowed-group=payments-engineers
            # Identity reaches kubesentry only in these headers, and only over the socket.
            - --pass-user-headers=true
            - --set-xauthrequest=true
            - --skip-auth-strip-headers=true
            # API calls get 401 instead of a login redirect.
            - --api-route=^/api/
            # Behind the ALB: trust its X-Forwarded-Proto/Host for redirects.
            - --reverse-proxy=true
            - --skip-provider-button=true
            - --silence-ping-logging=true
            - --cookie-name=_kubesentry
            - --cookie-secure=true
            - --cookie-expire=12h
            - --cookie-refresh=1h
            - --cookie-samesite=lax
            - --session-store-type=redis
            - --redis-connection-url=rediss://master.kubesentry-sessions.abcdef.use1.cache.amazonaws.com:6379
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kubesentry-oauth2
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: kubesentry-oauth2
                  key: cookie-secret
            - name: OAUTH2_PROXY_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubesentry-redis
                  key: redis-password
          ports:
            - name: web
              containerPort: 4180
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: web
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: web
            periodSeconds: 20
            timeoutSeconds: 5
          lifecycle:
            preStop:
              # Keep serving while the load balancer deregisters this pod.
              sleep:
                seconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 20m
              memory: 32Mi
          volumeMounts:
            - name: web-socket
              mountPath: /var/run/kubesentry
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # The web socket between oauth2-proxy and kubesentry (mode 0660; both
        # run with the pod's fsGroup).
        - name: web-socket
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: auth-group-map
          configMap:
            name: kubesentry-auth
        - name: pg-ca
          configMap:
            name: rds-ca

