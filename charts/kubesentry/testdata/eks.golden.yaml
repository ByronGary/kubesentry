# Source: kubesentry/templates/apf.yaml
# API Priority and Fairness: kubesentry's requests (informer LISTs and WATCHes,
# SubjectAccessReviews) get their own priority level, so a burst from kubesentry
# queues behind its own share instead of competing with controllers and users.
apiVersion: flowcontrol.apiserver.k8s.io/v1
kind: PriorityLevelConfiguration
metadata:
  name: kubesentry
  labels:
    helm.sh/chart: kubesentry-0.1.0
    app.kubernetes.io/name: kubesentry
    app.kubernetes.io/instance: kubesentry
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubesentry
    app.kubernetes.io/component: server
spec:
  type: Limited
  limited:
    nominalConcurrencyShares: 20
    lendablePercent: 50
    limitResponse:
      type: Queue
      queuing:
        queues: 16
        handSize: 4
        queueLengthLimit: 50

