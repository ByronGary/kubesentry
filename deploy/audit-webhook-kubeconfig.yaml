# Example kube-apiserver audit webhook configuration for kubesentry.
#
# kube-apiserver flags:
#   --audit-policy-file=/etc/kubernetes/audit-policy.yaml
#   --audit-webhook-config-file=/etc/kubernetes/audit-webhook-kubeconfig.yaml
#   --audit-webhook-mode=batch
#
# kubesentry flags:
#   -audit-token=<the token below> -tls-cert=... -tls-key=... -addr=:8443
apiVersion: v1
kind: Config
clusters:
  - name: kubesentry
    cluster:
      server: https://kubesentry.example.com:8443/audit/webhook
      certificate-authority: /etc/kubernetes/pki/kubesentry-ca.crt
users:
  - name: kubesentry
    user:
      token: REPLACE_WITH_AUDIT_TOKEN
contexts:
  - name: default
    context:
      cluster: kubesentry
      user: kubesentry
current-context: default
